<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>锦鲤签 · 好运倒计时</title>
<style>
/* ============ 设计令牌（与 design.md §2 一致） ============ */
:root{
  --abyss:#04121c;
  --deep:#072330;
  --jade:#35e3b3;
  --cyan:#58c9ff;
  --coral:#ff8f7a;
  --gold:#f2d79b;
  --paper:#f6eedd;
  --ink:#16262a;
  --text:#e9f6f4;
  --sub:rgba(233,246,244,.56);
  --line:rgba(233,246,244,.14);

  --font-serif:"Songti SC","STSong","Noto Serif SC",serif;
  --font-sans:"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --font-num:"Avenir Next","Helvetica Neue",Helvetica,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100dvh;
  background:var(--abyss);
  color:var(--text);
  font-family:var(--font-sans);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit}
.hidden{display:none !important}

/* ============ L1~L4 背景层 ============ */
.layers{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

/* L1 底色：多层径向渐变 */
.layer-grad{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 16% 8%, rgba(53,227,179,.22), transparent 58%),
    radial-gradient(90% 70% at 84% 4%, rgba(88,201,255,.20), transparent 62%),
    radial-gradient(110% 80% at 52% 112%, rgba(255,143,122,.14), transparent 60%),
    linear-gradient(180deg,#04121c 0%,#07222f 46%,#051a26 100%);
}

/* L1 底色：三个缓慢漂移的模糊色块，制造"水在动"的错觉 */
.blobs{position:absolute;inset:0}
.blobs i{
  position:absolute;display:block;border-radius:50%;
  filter:blur(70px);opacity:.32;will-change:transform;
}
.blobs i:nth-child(1){width:44vw;height:44vw;left:-6vw;top:-8vw;background:#1ad3a0;animation:driftA 26s ease-in-out infinite}
.blobs i:nth-child(2){width:38vw;height:38vw;right:-8vw;top:6vh;background:#2f9de0;animation:driftB 31s ease-in-out infinite}
.blobs i:nth-child(3){width:50vw;height:50vw;left:28vw;bottom:-24vw;background:#ff7a63;opacity:.18;animation:driftC 37s ease-in-out infinite}
@keyframes driftA{50%{transform:translate3d(6vw,5vh,0) scale(1.12)}}
@keyframes driftB{50%{transform:translate3d(-7vw,7vh,0) scale(1.08)}}
@keyframes driftC{50%{transform:translate3d(-5vw,-6vh,0) scale(1.1)}}

/* L2 光束：三道斜向柔光 */
.layer-shafts i{
  position:absolute;top:-25%;width:14vw;height:150%;
  background:linear-gradient(180deg,rgba(150,255,228,.16),rgba(150,255,228,0) 72%);
  filter:blur(26px);transform:rotate(17deg);transform-origin:50% 0;
  animation:sway 22s ease-in-out infinite;
}
.layer-shafts i:nth-child(1){left:12%}
.layer-shafts i:nth-child(2){left:42%;width:8vw;opacity:.7;animation-delay:-7s;animation-duration:28s}
.layer-shafts i:nth-child(3){left:74%;width:18vw;opacity:.55;animation-delay:-13s;animation-duration:34s}
@keyframes sway{50%{transform:rotate(21deg) translateX(2vw);opacity:.55}}

/* L3 / L4 画布 */
.layer-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#dustCanvas{opacity:.9}
#koiCanvas{opacity:1}

/* 颗粒质感 */
.layer-grain{
  position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}

/* 暖金层：仅 S4 淡入 */
#warm{
  position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;
  background:
    radial-gradient(80% 60% at 50% 62%, rgba(255,196,120,.42), transparent 62%),
    radial-gradient(120% 90% at 50% 120%, rgba(255,143,110,.34), transparent 60%);
}
body.celebrate #warm{opacity:1}

/* ============ 顶部栏 ============ */
.topbar{
  position:fixed;z-index:20;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 36px;
}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-cn{
  font-family:var(--font-serif);font-size:19px;letter-spacing:.34em;
  text-indent:.34em;color:#f4fffb;
}
.brand-en{font-size:9.5px;letter-spacing:.34em;color:rgba(233,246,244,.34)}

.btn-reset{
  padding:8px 16px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--sub);font-size:12px;letter-spacing:.14em;transition:.25s;
}
.btn-reset:hover{color:var(--gold);border-color:rgba(242,215,155,.45)}

/* ============ 左侧竖排装饰 ============ */
.rail{
  position:fixed;z-index:12;left:30px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;font-size:10.5px;letter-spacing:.46em;
  color:rgba(242,215,155,.30);pointer-events:none;
}

/* ============ 主内容 ============ */
.stage{
  position:relative;z-index:10;min-height:100dvh;
  display:grid;place-items:center;
  padding:96px 24px 128px;
}
.panel{width:100%}

/* 入场编排 */
.setup{max-width:660px;text-align:left;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.setup .eyebrow{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:0ms}
.setup-title{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:90ms}
.setup-sub{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:150ms}
.chips{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:180ms}
.date-row{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:250ms}
#btnStart{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:320ms}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.eyebrow{
  margin:0;font-size:11px;letter-spacing:.40em;text-indent:.40em;
  color:var(--gold);opacity:.82;
}
.setup-title{
  margin:20px 0 16px;font-family:var(--font-serif);font-weight:400;
  font-size:clamp(38px,5.2vw,58px);line-height:1.26;letter-spacing:.06em;
  background:linear-gradient(118deg,#f7fffc 8%,#a8f2dc 58%,#93b3c2 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.setup-sub{margin:0;max-width:27em;font-size:15px;line-height:1.95;color:var(--sub);letter-spacing:.04em}

/* 快捷日期胶囊 */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.chip{
  padding:10px 18px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
  color:var(--text);font-size:13.5px;letter-spacing:.04em;
  transition:border-color .25s,color .25s,background .25s,transform .25s,box-shadow .25s;
}
.chip:hover{border-color:rgba(53,227,179,.55);color:#c9ffe9;transform:translateY(-1px)}
.chip.active{
  border-color:var(--jade);
  background:linear-gradient(180deg,rgba(53,227,179,.18),rgba(53,227,179,.06));
  color:#ddfff4;
  box-shadow:0 0 0 1px rgba(53,227,179,.18),0 10px 28px -16px rgba(53,227,179,.9);
}

/* 自定义日期 */
.date-row{display:flex;align-items:center;gap:14px;margin-top:22px}
.date-label{font-size:12px;letter-spacing:.2em;color:var(--sub)}
.date-input{
  padding:10px 14px;border-radius:10px;font-family:var(--font-num);font-size:15px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);
  color-scheme:dark;outline:none;transition:.25s;
}
.date-input:focus{border-color:rgba(53,227,179,.55);box-shadow:0 0 0 3px rgba(53,227,179,.12)}
.date-input::-webkit-calendar-picker-indicator{filter:invert(.75);cursor:pointer}

/* 主按钮 */
.btn-primary{
  margin-top:38px;padding:15px 44px;border:none;border-radius:999px;cursor:pointer;
  background:linear-gradient(135deg,#35e3b3,#58c9ff);color:#04222c;
  font-size:14px;font-weight:600;letter-spacing:.24em;text-indent:.24em;
  box-shadow:0 16px 44px -18px rgba(53,227,179,.9);
  transition:transform .25s,filter .25s,box-shadow .25s,opacity .25s;
}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn-primary:active{transform:scale(.985)}
.btn-primary:disabled{opacity:.32;cursor:not-allowed;box-shadow:none;transform:none}
.btn-primary.small{margin:0;padding:13px 30px;font-size:13px;letter-spacing:.16em;text-indent:.16em}

/* ============ S1 倒计时 ============ */
.countdown{
  display:flex;flex-direction:column;align-items:center;gap:26px;
  text-align:center;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
.clock{display:flex;align-items:flex-start;justify-content:center;gap:clamp(8px,2.2vw,30px)}
.unit{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:clamp(64px,9vw,120px)}
.num{
  font-family:var(--font-num);font-weight:200;
  font-size:clamp(56px,10.4vw,128px);line-height:.9;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;color:#f2fffb;
  text-shadow:0 0 48px rgba(53,227,179,.30);
}
.num.flip{animation:numIn .4s ease}
@keyframes numIn{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.lab{font-size:11px;letter-spacing:.42em;text-indent:.42em;color:var(--sub)}
.sep{
  width:1px;height:clamp(30px,5.6vw,64px);margin-top:clamp(18px,3.6vw,44px);
  background:linear-gradient(180deg,transparent,rgba(242,215,155,.5),transparent);
}
.date-line{margin:0;font-size:12.5px;letter-spacing:.16em;color:var(--sub)}

/* 签筒入口 */
.draw-btn{
  position:relative;margin-top:8px;display:inline-flex;align-items:center;gap:12px;
  padding:15px 32px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(242,215,155,.45);
  background:rgba(255,255,255,.055);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--gold);font-size:13px;letter-spacing:.26em;
  transition:background .3s,border-color .3s,box-shadow .3s;
}
.draw-btn:hover{background:rgba(242,215,155,.12);border-color:rgba(242,215,155,.8);box-shadow:0 0 44px -10px rgba(242,215,155,.5)}
.draw-btn::after{
  content:"";position:absolute;inset:-7px;border-radius:999px;
  border:1px solid rgba(242,215,155,.16);animation:halo 3.4s ease-in-out infinite;
}
@keyframes halo{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.5;transform:scale(1.02)}}
.draw-dot{
  width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 12px var(--gold);animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* S4 庆祝按钮组 */
.celebrate-actions{display:flex;gap:14px;margin-top:8px}

/* ============ S2/S3 弹层 ============ */
.overlay{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;
  background:rgba(3,12,18,.62);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transition:opacity .4s ease;
}
.overlay.hidden{display:grid !important;opacity:0;pointer-events:none}

.draw-stage{display:flex;flex-direction:column;align-items:center;gap:26px;perspective:1600px}

.card{
  position:relative;width:min(92vw,440px);height:min(76vh,620px);
  transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
  transform:rotateY(0deg) rotateZ(-1.6deg);
  transition:transform .9s cubic-bezier(.2,.75,.2,1);
}
.card.flipped{transform:rotateY(180deg) rotateZ(0deg)}
.card.shaking{animation:shake 1.15s ease-in-out}
@keyframes shake{
  0%,100%{transform:rotateY(0deg) rotateZ(-1.6deg)}
  25%{transform:rotateY(0deg) rotateZ(2.2deg) translateX(-6px)}
  55%{transform:rotateY(0deg) rotateZ(-2.6deg) translateX(6px)}
  80%{transform:rotateY(0deg) rotateZ(1deg) translateX(0)}
}

.face{
  position:absolute;inset:0;border-radius:18px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.8);
}

/* 卡背：深色玻璃 + 金色细边 + 锦鲤浮雕 */
.face-sleeve{
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(53,227,179,.16), transparent 60%),
    linear-gradient(160deg,#0c2a36,#061923 70%);
  border:1px solid rgba(242,215,155,.28);
  display:grid;place-items:center;
}
.sleeve-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
.sleeve-top,.sleeve-bot{font-size:10.5px;letter-spacing:.36em;text-indent:.36em;color:rgba(242,215,155,.55)}
.sleeve-koi{width:150px;height:150px;opacity:.62}

/* 正面：米黄纸签 */
.face-sign{
  transform:rotateY(180deg);
  background:
    repeating-linear-gradient(90deg,rgba(120,92,52,.05) 0 1px,transparent 1px 5px),
    radial-gradient(120% 90% at 18% 0%,#fffaf0,#f4e8d1 72%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 0 60px rgba(180,150,100,.18),0 40px 80px -30px rgba(0,0,0,.8);
  color:var(--ink);
  padding:14px;
}

/* 双线内框：让纸签更像一张真的签纸 */
.paper-frame{
  position:absolute;inset:10px;border:1px solid rgba(176,136,74,.34);
  border-radius:11px;pointer-events:none;
}
.paper-frame::after{
  content:"";position:absolute;inset:4px;border:1px solid rgba(176,136,74,.16);border-radius:8px;
}

/* 签面内容区：四组内容按「签头 / 解读 / 幸运 / 页脚」拉开，超出时在卡片内滚动 */
.sign-inner{
  position:relative;height:100%;overflow-y:auto;overscroll-behavior:contain;
  padding:22px 20px 18px;display:flex;flex-direction:column;
  justify-content:space-between;text-align:center;
  scrollbar-width:none;
}
.sign-inner::-webkit-scrollbar{display:none}
.sign-top,.sign-mid,.sign-low{display:flex;flex-direction:column;flex:0 0 auto}

/* 首行右侧留出印章位置，避免「第 N 签」被印章压住 */
.sign-head-row{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;letter-spacing:.26em;color:rgba(22,38,42,.5);padding-right:54px}
.sign-no{letter-spacing:.1em}
.seal{
  position:absolute;top:6px;right:2px;width:46px;height:46px;border-radius:5px;
  border:2px solid #c4523c;color:#c4523c;display:grid;place-items:center;
  font-family:var(--font-serif);font-size:15px;letter-spacing:.02em;
  transform:rotate(7deg);opacity:.92;
}
.sign-title{
  margin:22px 0 0;font-family:var(--font-serif);font-size:clamp(27px,4.2vw,36px);
  font-weight:600;letter-spacing:.2em;text-indent:.2em;color:#17282b;line-height:1.2;
}
.sign-tier-line{
  margin:8px 0 0;font-family:var(--font-serif);font-size:10.5px;
  letter-spacing:.3em;text-indent:.3em;color:rgba(196,82,60,.72);
}
.sign-verse{
  margin:14px 0 0;font-size:14.5px;line-height:1.95;letter-spacing:.06em;
  color:#3b4b48;white-space:pre-line;
}
.sign-divider{
  height:1px;margin:0 0 14px;
  background:linear-gradient(90deg,transparent,rgba(180,140,80,.55),transparent);
}
/* 解签：白话解读，做成「引文块」——左侧金线 + 极淡底，和吉语拉开层次 */
.read-k{
  margin:0 0 7px;font-family:var(--font-serif);font-size:10px;
  letter-spacing:.30em;text-indent:.30em;color:rgba(138,106,51,.9);text-align:left;
}
.sign-read{
  margin:0;padding:10px 13px;border-left:2px solid rgba(176,136,74,.42);
  background:rgba(176,136,74,.055);border-radius:0 8px 8px 0;
  font-size:12px;line-height:1.9;letter-spacing:.03em;
  color:#4b5a56;text-align:left;
}
.sign-advice{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:16px}
.advice-row{display:flex;align-items:center;gap:11px}
.advice-k{
  flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:#1f3b3a;color:#f6eedd;font-size:10.5px;
}
.advice-k.bad{background:#c4523c}
.advice-v{font-size:12.5px;line-height:1.7;letter-spacing:.04em;color:#42524e}
/* 幸运色 / 幸运数字 */
.sign-luck{
  display:flex;justify-content:center;gap:22px;margin-top:0;
  font-size:11px;letter-spacing:.06em;color:#5c6b66;
}
.luck-item{display:inline-flex;align-items:center;gap:6px}
.luck-item b{font-weight:600;color:#2f4340;letter-spacing:.08em}
.luck-dot{
  width:9px;height:9px;border-radius:50%;display:inline-block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
/* 今日小贴士 */
.sign-tip{
  margin:12px 0 0;padding-top:11px;font-size:11.5px;line-height:1.75;
  letter-spacing:.03em;color:rgba(22,38,42,.52);text-align:center;
  border-top:1px dashed rgba(176,136,74,.3);
}
.sign-tip-k{
  font-family:var(--font-serif);letter-spacing:.2em;color:rgba(138,106,51,.8);margin-right:6px;
}
.sign-foot{
  padding-top:4px;font-family:var(--font-serif);
  font-size:10.5px;letter-spacing:.3em;text-indent:.3em;color:rgba(22,38,42,.38);
}

.card-actions{display:flex;gap:14px}
.btn-ghost{
  padding:13px 26px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(242,215,155,.4);background:rgba(255,255,255,.04);
  color:var(--gold);font-size:13px;letter-spacing:.16em;text-indent:.16em;
  transition:border-color .25s,background .25s;
}
.btn-ghost:hover{border-color:rgba(242,215,155,.8);background:rgba(242,215,155,.1)}
.btn-ghost:disabled{opacity:.5;cursor:default}

/* ============ 提示与吐司 ============ */
.hint{
  position:fixed;z-index:12;left:36px;bottom:28px;margin:0;
  font-size:11px;letter-spacing:.16em;color:rgba(233,246,244,.32);pointer-events:none;
}
.toast{
  position:fixed;z-index:60;left:50%;bottom:96px;transform:translate(-50%,10px);
  padding:11px 22px;border-radius:999px;font-size:12.5px;letter-spacing:.1em;
  background:rgba(10,34,44,.92);border:1px solid rgba(242,215,155,.35);color:var(--gold);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .rail{display:none}
}
@media (max-width:720px){
  .hint{display:none}
  .topbar{padding:18px 20px}
  .brand-cn{font-size:16px}
  .brand-en{display:none}
  .stage{padding:88px 22px 132px}
  .setup-title{font-size:34px}
  .clock{display:grid;grid-template-columns:1fr 1fr;gap:22px 8px}
  .sep{display:none}
  .unit{min-width:0;gap:10px}
  .num{font-size:clamp(48px,16vw,74px)}
  .draw-btn{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom));margin:0;white-space:nowrap;z-index:25;
  }
  .draw-btn:hover{transform:translateX(-50%)}
  .celebrate-actions{flex-direction:column;align-items:center}
  .card{width:min(90vw,380px);height:min(78vh,560px)}
  .sign-inner{padding:16px 14px 14px}
  .sign-title{font-size:26px;margin-top:16px}
  .sign-tier-line{font-size:9.5px}
  .sign-verse{font-size:13.5px;margin-top:12px;line-height:1.8}
  .sign-divider{margin:13px 0 11px}
  .sign-read{font-size:11.5px;line-height:1.8}
  .sign-luck{gap:14px;font-size:10.5px;margin-top:11px}
  .sign-tip{font-size:11px;margin-top:10px;padding-top:9px}
  .sign-foot{font-size:10px;padding-top:9px}
  .seal{top:4px;right:0;width:40px;height:40px;font-size:13px}
  .sign-head-row{padding-right:48px}
  .card-actions{width:100%;justify-content:center;flex-wrap:wrap}
}
@media (max-height:700px){
  .stage{padding-top:78px;padding-bottom:104px}
  /* 卡片高度必须给「按钮行 + 间距」留出空间，否则翻面后按钮会被挤到屏幕外 */
  .card{height:min(calc(100dvh - 170px),600px)}
  .draw-stage{gap:16px}
  .sign-title{font-size:25px;margin-top:14px}
  .sign-verse{line-height:1.75;font-size:13px;margin-top:10px}
  .sign-divider{margin:12px 0 10px}
  .sign-read{font-size:11px;line-height:1.7}
  .sign-advice{margin-top:10px;gap:6px}
  .sign-luck{margin-top:10px}
  .sign-tip{margin-top:8px;padding-top:8px;font-size:10.5px}
}

/* 手机横屏：高度极浅，倒计时回到一行、卡片吃掉剩余高度 */
@media (max-height:520px) and (orientation:landscape){
  .stage{padding:52px 18px 20px}
  .clock{display:flex;gap:clamp(6px,1.8vw,18px)}
  .sep{display:block;height:30px;margin-top:12px}
  .num{font-size:clamp(34px,11vh,58px)}
  .unit{min-width:0;gap:6px}
  .lab{font-size:9.5px}
  .countdown{gap:14px}
  .draw-btn{position:static;transform:none;margin-top:2px;padding:11px 24px}
  .draw-btn:hover{transform:none}
  .card{width:min(72vw,360px);height:min(78vh,340px)}
  .draw-stage{gap:12px}
  .sign-title{font-size:22px;margin-top:10px}
  .sign-verse{font-size:12.5px;margin-top:8px;line-height:1.65}
  .sign-read{font-size:11px;line-height:1.65}
  .sign-advice{margin-top:8px;gap:5px}
  .sign-luck{margin-top:8px}
  .sign-tip{margin-top:7px;padding-top:7px}
  .sign-foot{padding-top:8px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition-duration:.01ms !important}

/* ============================================================
   三、日期与签文工具
   ============================================================ */

/** 把 Date 转成本地时区的 YYYY-MM-DD */
function toISODate(d){
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

/** 把 YYYY-MM-DD 转成当天零点的 Date */
function fromISODate(str){
  var parts = str.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
}

/** 展示用日期：2027.01.01 */
function formatDot(dateStr){
  return dateStr.replace(/-/g, '.');
}

/** 展示用短日期：01月01日 */
function formatShort(str){
  var p = str.split('-');
  return p[1] + '月' + p[2] + '日';
}

/** FNV-1a 字符串哈希，用于把日期映射成确定的签号 */
function hashString(str){
  var h = 2166136261;
  for (var i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** 取今天的锦鲤签：同一天所有人一致，跨日更换 */
function currentSign(){
  var key = toISODate(new Date());
  var idx = hashString(key) % SIGN_POOL.length;
  var item = SIGN_POOL[idx];
  return {
    tier: item.t,
    title: item.h,
    verse: item.v,
    good: item.g,
    bad: item.b,
    read: item.r,
    color: item.c,
    colorHex: item.ch,
    tip: item.tip,
    no: idx + 1,
    // 幸运数字由签号推导，保证同签同数、无需再维护一张表
    luck: ((idx + 1) * 7 % 9) + 1,
    dateKey: key
  };
}

/** 数字补零 */
function pad2(n){ return String(n).padStart(2, '0'); }

/** 保存 / 读取本地目标日 */
function saveTarget(){
  try{
    if (state.target){
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: state.target.date,
        label: state.target.label
      }));
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }
  }catch(e){ /* 隐私模式下忽略 */ }
}

function loadTarget(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var obj = JSON.parse(raw);
    if (!obj || !obj.date) return null;
    return {
      date: obj.date,
      label: obj.label || formatShort(obj.date),
      ts: fromISODate(obj.date).getTime()
    };
  }catch(e){ return null; }
}

/** 设定目标日并进入倒计时态 */
function applyTarget(dateStr, label){
  state.target = {
    date: dateStr,
    label: label || formatShort(dateStr),
    ts: fromISODate(dateStr).getTime()
  };
  state.celebrated = false;
  document.body.classList.remove('celebrate');
  el.celebrateActions.classList.add('hidden');
  el.btnDraw.classList.remove('hidden');
  saveTarget();
  showCountdown();
}

/* ============================================================
   五、倒计时
   ============================================================ */

/** 更新时间显示；每秒只在秒数变化时改 DOM */
function renderCountdown(force){
  if (!state.target) return;

  var remain = state.target.ts - Date.now();
  var total = Math.max(0, Math.floor(remain / 1000));
  var d = Math.floor(total / 86400);
  var h = Math.floor((total % 86400) / 3600);
  var m = Math.floor((total % 3600) / 60);
  var s = total % 60;

  setNum(el.numDay, String(d));
  setNum(el.numHour, pad2(h));
  setNum(el.numMin, pad2(m));
  setNum(el.numSec, pad2(s));

  if (force){
    el.countEyebrow.textContent = '距离 ' + state.target.label;
  }
  // 归零后不再覆盖庆祝文案
  if (!state.celebrated){
    el.dateLine.textContent = formatDot(state.target.date) + ' · 还有 ' + d + ' 天';
  }

  // 归零：切到庆祝态，只触发一次
  if (remain <= 0 && !state.celebrated){
    celebrate();
  }
}

/** 写数字并在变化时播放 400ms 位移淡入 */
function setNum(node, value){
  if (node.textContent === value) return;
  node.textContent = value;
  node.classList.remove('flip');
  void node.offsetWidth;
  node.classList.add('flip');
}

/** S4 庆祝态：暖金淡入 + 文案替换 + 光点爆散 + 锦鲤上浮 */
function celebrate(){
  state.celebrated = true;
  document.body.classList.add('celebrate');
  document.body.dataset.state = 'S4';
  el.countEyebrow.textContent = '此 刻 已 至';
  el.dateLine.textContent = '你等到的那一天，到了。';
  el.btnDraw.classList.add('hidden');
  el.celebrateActions.classList.remove('hidden');
  burstSparks(window.innerWidth / 2, window.innerHeight * 0.56, 130);
  koiRise = 1.6;
}

/** 每帧检查秒数变化（用 rAF 驱动，避免 setInterval 漂移） */
var lastRenderedSec = -1;
function tickLoop(){
  if (state.target){
    var sec = Math.floor(Date.now() / 1000);
    if (sec !== lastRenderedSec){
      lastRenderedSec = sec;
      renderCountdown(false);
    }
  }
  requestAnimationFrame(tickLoop);
}

    document.body.dataset.state = 'S3';

    el.cardActions.classList.remove('hidden');
    try { el.btnClose.focus({ preventScroll: true }); } catch (e) { el.btnClose.focus(); }
  }, 2000);
}

   ============================================================ */

/** 在 Canvas 上按字距逐字绘制文本（Canvas 无 letter-spacing） */
function drawSpaced(ctx, text, centerX, y, size, gap, color, font, align){
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  var chars = text.split('');
  var widths = chars.map(function(ch){ return ctx.measureText(ch).width; });
  var total = widths.reduce(function(a, b){ return a + b; }, 0) + gap * (chars.length - 1);
  var x = (align === 'left') ? centerX : centerX - total / 2;
  for (var i = 0; i < chars.length; i++){
    ctx.fillText(chars[i], x, y);
    x += widths[i] + gap;
  }
  ctx.restore();
  return total;
}

/** 绘制圆角矩形路径 */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** 画一尾半透明锦鲤剪影（导出图装饰用；alpha 可调，深色背景上需要更高透明度） */
function drawKoiSilhouette(ctx, cx, cy, scale, alpha){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.18);
  ctx.globalAlpha = alpha || 0.16;

  var g = ctx.createLinearGradient(-260 * scale, 0, 260 * scale, 0);
  g.addColorStop(0, '#f2d79b');
  g.addColorStop(1, '#35e3b3');
  ctx.fillStyle = g;

  // 鱼身
  ctx.beginPath();
  ctx.moveTo(-240 * scale, 0);
  ctx.bezierCurveTo(-150 * scale, -110 * scale, 90 * scale, -125 * scale, 220 * scale, -40 * scale);
  ctx.bezierCurveTo(255 * scale, -18 * scale, 255 * scale, 18 * scale, 220 * scale, 40 * scale);
  ctx.bezierCurveTo(90 * scale, 125 * scale, -150 * scale, 110 * scale, -240 * scale, 0);
  ctx.fill();

  // 尾鳍
  ctx.beginPath();
  ctx.moveTo(220 * scale, 0);
  ctx.bezierCurveTo(300 * scale, -70 * scale, 350 * scale, -60 * scale, 385 * scale, -110 * scale);
  ctx.bezierCurveTo(355 * scale, -30 * scale, 355 * scale, 30 * scale, 385 * scale, 110 * scale);
  ctx.bezierCurveTo(350 * scale, 60 * scale, 300 * scale, 70 * scale, 220 * scale, 0);
  ctx.fill();

  // 眼睛
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#0a2029';
  ctx.beginPath();
  ctx.arc(-170 * scale, -14 * scale, 9 * scale, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/**
 * 在 Canvas 上按宽度自动换行绘制段落（逐字测量，兼容中英混排）。
 * 返回实际行数，便于调用方继续排下一块内容。
 */
function wrapText(ctx, text, cx, y, maxWidth, lineHeight, font, color, align){
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  var chars = text.split('');
  var line = '';
  var out = [];
  for (var i = 0; i < chars.length; i++){
    var test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line){
      out.push(line);
      line = chars[i];
    } else {
      line = test;
    }
  }
  if (line) out.push(line);
  for (var j = 0; j < out.length; j++){
    ctx.fillText(out[j], cx, y + j * lineHeight);
  }
  ctx.restore();
  return out.length;
}

/** 生成并下载 1080×1440 的锦鲤签图片 */
function exportSign(){
  var sign = state.sign || currentSign();
  var W = 1080, H = 1440;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var ctx = c.getContext('2d');

  // —— 底：深水渐变 ——
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#062330');
  bg.addColorStop(0.55, '#05202c');
  bg.addColorStop(1, '#04121c');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 光晕：左上青绿 / 右上冰蓝 / 底部珊瑚
  var glow1 = ctx.createRadialGradient(220, 140, 0, 220, 140, 620);
  glow1.addColorStop(0, 'rgba(53,227,179,0.26)');
  glow1.addColorStop(1, 'rgba(53,227,179,0)');
  ctx.fillStyle = glow1;
  ctx.fillRect(0, 0, W, H);

  var glow2 = ctx.createRadialGradient(900, 90, 0, 900, 90, 560);
  glow2.addColorStop(0, 'rgba(88,201,255,0.22)');
  glow2.addColorStop(1, 'rgba(88,201,255,0)');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, W, H);

  var glow3 = ctx.createRadialGradient(540, H + 80, 0, 540, H + 80, 700);
  glow3.addColorStop(0, 'rgba(255,143,122,0.20)');
  glow3.addColorStop(1, 'rgba(255,143,122,0)');
  ctx.fillStyle = glow3;
  ctx.fillRect(0, 0, W, H);

  // —— 顶部品牌 ——
  drawSpaced(ctx, '锦鲤签', 120, 150, 30, 14, 'rgba(242,215,155,0.92)',
    '600 30px "Songti SC","STSong",serif', 'left');
  drawSpaced(ctx, 'KOI FORTUNE', 250, 150, 16, 8, 'rgba(233,246,244,0.42)',
    '400 16px "Helvetica Neue",Helvetica,sans-serif', 'left');

  // —— 纸签区块 ——
  var px = 100, py = 180, pw = 880, ph = 1120;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 60;
  ctx.shadowOffsetY = 30;
  var paperGrad = ctx.createLinearGradient(px, py, px + pw, py + ph);
  paperGrad.addColorStop(0, '#fffaf0');
  paperGrad.addColorStop(1, '#f2e4ca');
  ctx.fillStyle = paperGrad;
  roundRect(ctx, px, py, pw, ph, 26);
  ctx.fill();
  ctx.restore();

  // 纸面纤维
  ctx.save();
  roundRect(ctx, px, py, pw, ph, 26);
  ctx.clip();
  ctx.strokeStyle = 'rgba(120,92,52,0.045)';
  ctx.lineWidth = 1;
  for (var fx = px; fx < px + pw; fx += 5){
    ctx.beginPath();
    ctx.moveTo(fx, py);
    ctx.lineTo(fx, py + ph);
    ctx.stroke();
  }
  ctx.restore();

  // 双线内框
  ctx.save();
  ctx.strokeStyle = 'rgba(176,136,74,0.34)';
  ctx.lineWidth = 2;
  roundRect(ctx, px + 22, py + 22, pw - 44, ph - 44, 14);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(176,136,74,0.16)';
  ctx.lineWidth = 1.4;
  roundRect(ctx, px + 34, py + 34, pw - 68, ph - 68, 10);
  ctx.stroke();
  ctx.restore();

  // 右上角锦鲤剪影：画在纸签之后、正文之前，既不会被纸盖住，也不压住文字
  drawKoiSilhouette(ctx, 786, 96, 0.5, 0.30);

  // 页眉
  drawSpaced(ctx, '锦鲤签', px + 66, py + 70, 20, 6, 'rgba(22,38,42,0.52)',
    '400 20px "Songti SC","STSong",serif', 'left');
  ctx.save();
  ctx.font = '400 20px "PingFang SC","Hiragino Sans GB",sans-serif';
  ctx.fillStyle = 'rgba(22,38,42,0.46)';
  ctx.textAlign = 'right';
  ctx.fillText('第 ' + sign.no + ' 签', px + pw - 66, py + 70);
  ctx.restore();

  // 印章
  ctx.save();
  ctx.translate(px + pw - 148, py + 150);
  ctx.rotate(0.12);
  ctx.strokeStyle = '#c4523c';
  ctx.lineWidth = 4;
  ctx.strokeRect(-46, -46, 92, 92);
  ctx.fillStyle = '#c4523c';
  ctx.font = '600 38px "Songti SC","STSong",serif';

/* ============================================================
   八、背景动画：粒子 / 锦鲤 / 远景小鱼
   ============================================================ */

var dustCanvas = document.getElementById('dustCanvas');
var koiCanvas = document.getElementById('koiCanvas');
var dctx = dustCanvas.getContext('2d');
var kctx = koiCanvas.getContext('2d');

var W = window.innerWidth;
var H = window.innerHeight;
var DPR = Math.min(window.devicePixelRatio || 1, 2);

var dust = [];
var sparks = [];
var smallFish = [];
var koiList = [];
var koiRise = 0;          // S4 时锦鲤上浮的进度
var glowSprite = null;
var lastFrame = performance.now();

/** 生成一张柔光贴图，避免每帧创建径向渐变 */
function makeGlowSprite(){
  var s = 64;
  var c = document.createElement('canvas');
  c.width = s; c.height = s;
  var x = c.getContext('2d');
  var g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(230,255,248,0.95)');
  g.addColorStop(0.28, 'rgba(120,235,205,0.55)');
  g.addColorStop(1, 'rgba(53,227,179,0)');
  x.fillStyle = g;
  x.beginPath();
  x.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2);
  x.fill();
  return c;
}

/** 平滑阶跃：x 在 a→b 之间做 0→1 的 S 型过渡，用于拼出鱼体轮廓 */
function smoothstep(a, b, x){
  var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/**
 * 鱼身半宽剖面（0~1）。
 * 按真实锦鲤俯视轮廓取值：圆润吻端 → 肩部最宽（体长 36%）→ 中后段缓收 → 尾柄急收成细杆。
 * 关键是「宽段占比」：最宽区撑到 72% 才急收，鱼才敦实；收得过早会变成蝌蚪。
 */
function widthProfile(t){
  var snout = 0.12 + 0.88 * smoothstep(0, 0.30, t);      // 吻端留一点宽度，避免尖嘴
  var chest = 1 + 0.04 * smoothstep(0.22, 0.36, t);      // 最宽落在 36% 的肩胸
  var belly = 1 - 0.14 * smoothstep(0.42, 0.72, t);      // 中后段缓收
  var stem = 1 - 0.72 * smoothstep(0.72, 1.0, t);        // 尾柄急收
  return snout * chest * belly * stem;
}

/** 用二次曲线平滑连接一串点 */
function traceSmoothed(ctx, pts, close){
  if (!pts.length) return;
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length - 1; i++){
    var mx = (pts[i].x + pts[i + 1].x) / 2;
    var my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  var last = pts[pts.length - 1];
  ctx.lineTo(last.x, last.y);
  if (close) ctx.closePath();
}

/**
 * 创建一尾锦鲤。
 * opt：x/y=初始头位，len=体长（不含尾鳍），bodyW=半个体宽，speed=巡航速度。
 * 中轴固定 22 个点，点距 = len/21，摆动才会细腻；点太少会显得像折线木偶。
 */
function createKoi(opt){
  var n = 22;
  var seg = opt.len / (n - 1);
  var pts = [];
  for (var i = 0; i < n; i++){
    pts.push({ x: opt.x - i * seg, y: opt.y });
  }
  return {
    pts: pts,
    seg: seg,
    len: opt.len,
    bodyW: opt.bodyW,
    speed: opt.speed,
    heading: Math.PI,          // 初始朝左游
    target: { x: opt.x, y: opt.y },
    nextTurn: 0,
    phase: Math.random() * 6.28,
    seed: Math.random() * 10,
    alpha: opt.alpha,
    pal: opt.pal,
    patches: opt.patches
  };
}

/** 随机取一个画面内的漫游目标点 */
function randomTarget(){
  return {
    x: 60 + Math.random() * Math.max(1, W - 120),
    y: 80 + Math.random() * Math.max(1, H - 160)
  };
}

/** 求两个角度之间的最短差值（-π ~ π） */
function angleDelta(from, to){
  var d = to - from;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/**
 * 更新单尾锦鲤：漫游 / 抽签聚拢 / 鼠标避让 / 限角速度转向 / 链式跟随。
 * 转向用「限制角速度」而不是速度向量插值，鱼才走得出自然弧线，而不是直愣愣地折线。
 */
function updateKoi(k, dt, now){
  if (now > k.nextTurn){
    k.target = randomTarget();
    k.nextTurn = now + 3000 + Math.random() * 4000;
  }

  var hx = k.pts[0].x;
  var hy = k.pts[0].y;
  var tx = k.target.x;
  var ty = k.target.y;

  // 抽签时向卡片聚拢
  if (attract){
    tx = attract.x + Math.sin(now / 900 + k.seed) * 70;
    ty = attract.y + Math.cos(now / 1100 + k.seed) * 50;
  }

  // 鼠标避让：进入 180px 内就掉头游开
  if (pointer.active){
    var dxp = hx - pointer.x;
    var dyp = hy - pointer.y;
    var dp = Math.sqrt(dxp * dxp + dyp * dyp) || 1;
    if (dp < 180){
      tx = hx + (dxp / dp) * 320;
      ty = hy + (dyp / dp) * 320;
    }
  }

  // 限角速度转向：每秒最多转 1.15 弧度，转弯半径自然、不抽搐
  var desired = Math.atan2(ty - hy, tx - hx);
  var maxTurn = 1.15 * dt;
  var turn = Math.max(-maxTurn, Math.min(maxTurn, angleDelta(k.heading, desired)));
  k.heading += turn;

  // 巡航速度轻微起伏，避免匀速像传送带
  var sp = k.speed * (0.84 + 0.16 * Math.sin(now / 1500 + k.seed));

  k.pts[0].x += Math.cos(k.heading) * sp * dt;
  k.pts[0].y += Math.sin(k.heading) * sp * dt - (koiRise > 0 ? 34 * dt : 0);

  // 链式跟随：每节与前节保持固定间距，头部转弯会沿身体传成一道波
  for (var i = 1; i < k.pts.length; i++){
    var p = k.pts[i];
    var prev = k.pts[i - 1];
    var ddx = p.x - prev.x;
    var ddy = p.y - prev.y;
    var dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
    p.x = prev.x + (ddx / dl) * k.seg;
    p.y = prev.y + (ddy / dl) * k.seg;
  }

  // 摆尾频率随速度走：游得快，尾摆得快
  k.phase += dt * (1.8 + Math.min(2.4, sp / 34));

  // 越界时整尾平移回画面，避免游丢
  var hx2 = k.pts[0].x;
  var hy2 = k.pts[0].y;
  if (hx2 < -160 || hx2 > W + 160 || hy2 < -160 || hy2 > H + 160){
    var sx = hx2 < -160 ? W + 320 : (hx2 > W + 160 ? -W - 320 : 0);
    var sy = hy2 < -160 ? H + 320 : (hy2 > H + 160 ? -H - 320 : 0);
    for (var j = 0; j < k.pts.length; j++){
      k.pts[j].x += sx;
      k.pts[j].y += sy;
    }
  }
}

/** 由点链算出每个点的单位法线（垂直于局部切线） */
function computeNormals(pts){
  var n = pts.length;
  var out = [];
  for (var i = 0; i < n; i++){
    var a = pts[Math.max(0, i - 1)];
    var b = pts[Math.min(n - 1, i + 1)];
    var dx = a.x - b.x;
    var dy = a.y - b.y;
    var L = Math.sqrt(dx * dx + dy * dy) || 1;
    out.push({ x: -dy / L, y: dx / L });
  }
  return out;
}

/**
 * 生成一块不规则闭合色块（锦鲤花斑）。
 * 用固定 seed 的正弦扰动让边缘起伏，再用二次曲线平滑，避免变成标准椭圆。
 */
function blobPath(ctx, cx, cy, rx, ry, rot, seed){
  var steps = 18;
  var ring = [];
  for (var i = 0; i < steps; i++){
    var a = (i / steps) * Math.PI * 2;
    var wob = 1 + Math.sin(a * 3 + seed) * 0.17 + Math.sin(a * 5 + seed * 1.7) * 0.09;
    var px = Math.cos(a) * rx * wob;
    var py = Math.sin(a) * ry * wob;
    ring.push({
      x: cx + px * Math.cos(rot) - py * Math.sin(rot),
      y: cy + px * Math.sin(rot) + py * Math.cos(rot)
    });
  }
  ctx.beginPath();
  for (var j = 0; j <= steps; j++){
    var cur = ring[j % steps];
    var nxt = ring[(j + 1) % steps];
    var mx = (cur.x + nxt.x) / 2;
    var my = (cur.y + nxt.y) / 2;
    if (j === 0) ctx.moveTo(mx, my);
    else ctx.quadraticCurveTo(cur.x, cur.y, mx, my);
  }
  ctx.closePath();
}

/**
 * 尾鳍：两片大分叉叶片 + 鳍条。
 * 夹角由相位驱动，游动时鳍会自己张开合拢——这是"活鱼"最关键的信号。
 */
function drawTail(ctx, k, tip, fx, fy){
  var L = k.len * 0.34;                        // 尾鳍要有分量，太小会像鱼多了个尾巴尖
  var sway = Math.sin(k.phase + 0.9);
  // 尾柄末端有宽度，两片叶各自从「尾柄该侧的边缘」长出来，而不是从同一点插出去
  var nx0 = -fy;
  var ny0 = fx;
  var rootW = k.bodyW * 0.13;

  for (var s = -1; s <= 1; s += 2){
    var rx = tip.x + nx0 * rootW * s;
    var ry = tip.y + ny0 * rootW * s;
    var spread = s * (0.46 + sway * 0.12);
    var ax = fx * Math.cos(spread) - fy * Math.sin(spread);
    var ay = fx * Math.sin(spread) + fy * Math.cos(spread);
    var ux = -ay * s, uy = ax * s;             // 叶片外扩方向（单位向量）
    var wa = L * 0.42;
    var ex = rx + ax * L;
    var ey = ry + ay * L;
    var m1x = rx + ax * L * 0.52 + ux * wa;
    var m1y = ry + ay * L * 0.52 + uy * wa;
    var m2x = rx + ax * L * 0.60 - ux * wa * 0.40;
    var m2y = ry + ay * L * 0.60 - uy * wa * 0.40;

    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.quadraticCurveTo(m1x, m1y, ex, ey);
    ctx.quadraticCurveTo(m2x, m2y, rx, ry);
    var tg = ctx.createLinearGradient(rx, ry, ex, ey);
    tg.addColorStop(0, k.pal.tail0);
    tg.addColorStop(0.7, k.pal.tail1);
    tg.addColorStop(1, k.pal.tail2);
    ctx.fillStyle = tg;
    ctx.globalAlpha = k.alpha * 0.82;
    ctx.fill();

    // 鳍条：从叶片根部放射到外缘
    ctx.globalAlpha = k.alpha * 0.30;
    ctx.strokeStyle = k.pal.fin;
    ctx.lineWidth = 0.9;
    for (var j = 1; j <= 4; j++){
      var u = j / 5;
      var bx = rx + ax * L * u + ux * wa * Math.sin(u * Math.PI) * 0.9;
      var by = ry + ay * L * u + uy * wa * Math.sin(u * Math.PI) * 0.9;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }
  }
}

/**
 * 画一片鳍叶：以 (x,y) 为根、angle 为伸展角、len 为长、wid 为最宽处。
 * 胸鳍、腹鳍共用同一套画法。
 */
function drawFinLeaf(ctx, x, y, angle, len, wid, color, alpha){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.62, -wid, len, 0);
  ctx.quadraticCurveTo(len * 0.62, wid, 0, 0);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.fill();
  ctx.restore();
}

/**
 * 绘制一尾锦鲤：尾鳍 → 身体 → 斑纹 → 胸腹鳍 → 鲤须 → 嘴与眼。
 * 侧向波动只在绘制期叠加，不回写中轴点，避免逐帧累积导致整尾漂移。
 */
function drawKoi(k){
  var pts = k.pts;
  var n = pts.length;
  var baseNormals = computeNormals(pts);

  // 1) 绘制期侧向波动：越靠尾摆幅越大（t^1.6），形成锦鲤经典的 S 形游姿
  var spine = [];
  for (var i = 0; i < n; i++){
    var t = i / (n - 1);
    var amp = k.bodyW * 0.62 * Math.pow(t, 1.6);
    var off = Math.sin(k.phase - i * 0.34) * amp;
    spine.push({
      x: pts[i].x + baseNormals[i].x * off,
      y: pts[i].y + baseNormals[i].y * off
    });
  }
  var normals = computeNormals(spine);

  var tip = spine[n - 1];
  var prev = spine[n - 2];
  var fdx = tip.x - prev.x;
  var fdy = tip.y - prev.y;
  var fl = Math.sqrt(fdx * fdx + fdy * fdy) || 1;
  var fx = fdx / fl;
  var fy = fdy / fl;
  var bodyAngle = Math.atan2(fy, fx);

  kctx.save();
  kctx.globalAlpha = k.alpha;
  kctx.lineJoin = 'round';
  kctx.lineCap = 'round';

  // 2) 尾鳍先画，压在身体下面
  drawTail(kctx, k, tip, fx, fy);

  // 3) 身体轮廓：左半 + 右半反向拼接，二次曲线平滑
  var left = [];
  var right = [];
  for (var i2 = 0; i2 < n; i2++){
    var w = k.bodyW * widthProfile(i2 / (n - 1));
    left.push({ x: spine[i2].x + normals[i2].x * w, y: spine[i2].y + normals[i2].y * w });
    right.push({ x: spine[i2].x - normals[i2].x * w, y: spine[i2].y - normals[i2].y * w });
  }
  var outline = left.concat(right.slice().reverse());

  kctx.beginPath();
  traceSmoothed(kctx, outline, true);
  var bg = kctx.createLinearGradient(spine[0].x, spine[0].y, tip.x, tip.y);
  bg.addColorStop(0, k.pal.body0);
  bg.addColorStop(0.45, k.pal.body1);
  bg.addColorStop(1, k.pal.body2);
  kctx.fillStyle = bg;
  kctx.fill();

  // 4) 斑纹与立体光影都裁剪在体内
  kctx.save();
  kctx.clip();

  // 4.1 横向光影：一侧亮一侧暗，鱼身才有圆柱感
  var mi = Math.floor(n * 0.36);
  var mw = k.bodyW * widthProfile(0.36) * 1.1;
  var lg = kctx.createLinearGradient(
    spine[mi].x + normals[mi].x * mw, spine[mi].y + normals[mi].y * mw,
    spine[mi].x - normals[mi].x * mw, spine[mi].y - normals[mi].y * mw);
  lg.addColorStop(0, 'rgba(255,255,255,0.30)');
  lg.addColorStop(0.42, 'rgba(255,255,255,0)');
  lg.addColorStop(1, 'rgba(0,0,0,0.22)');
  kctx.fillStyle = lg;
  kctx.fillRect(0, 0, W, H);

  // 4.2 花纹：不规则闭合色块——鲤鱼的斑是实心块，不是模糊光斑
  for (var p = 0; p < k.patches.length; p++){
    var pt = k.patches[p];
    var si = Math.max(0, Math.min(n - 1, Math.floor(pt.i * (n - 1))));
    var ww = k.bodyW * widthProfile(si / (n - 1));
    var cx = spine[si].x + normals[si].x * pt.off * ww;
    var cy = spine[si].y + normals[si].y * pt.off * ww;
    blobPath(kctx, cx, cy, k.bodyW * pt.r * 1.35, k.bodyW * pt.r * 0.95, bodyAngle, pt.seed);
    kctx.fillStyle = pt.color;
    kctx.fill();
  }
  kctx.restore();

  // 5) 轮廓描边：极细暗边，把鱼从水里"抠"出来
  kctx.beginPath();
  traceSmoothed(kctx, outline, true);
  kctx.strokeStyle = k.pal.edge;
  kctx.lineWidth = Math.max(1, k.bodyW * 0.055);
  kctx.stroke();

  // 6) 胸鳍 / 腹鳍：两对叶片，摆动相位错开
  var pIdx = Math.round(n * 0.26);   // 胸鳍：鳃盖之后
  var vIdx = Math.round(n * 0.52);   // 腹鳍：体中偏后
  for (var s2 = -1; s2 <= 1; s2 += 2){
    var flap1 = Math.sin(k.phase * 1.15 + s2 * 1.2) * 0.22;
    var pw = k.bodyW * widthProfile(pIdx / (n - 1));
    drawFinLeaf(kctx,
      spine[pIdx].x + normals[pIdx].x * pw * 0.85 * s2,
      spine[pIdx].y + normals[pIdx].y * pw * 0.85 * s2,
      // 胸鳍：从体侧伸出，略向后掠（约 90°），摆动时前后扇动
      bodyAngle + s2 * (1.58 + flap1),
      k.len * 0.22, k.bodyW * 0.34, k.pal.fin, k.alpha * 0.60);

    var flap2 = Math.sin(k.phase * 1.15 + s2 * 0.6 + 1.4) * 0.18;
    var vw = k.bodyW * widthProfile(vIdx / (n - 1));
    drawFinLeaf(kctx,
      spine[vIdx].x + normals[vIdx].x * vw * 0.82 * s2,
      spine[vIdx].y + normals[vIdx].y * vw * 0.82 * s2,
      // 腹鳍：位置更靠后、更短，指向后外侧（约 107°）
      bodyAngle + s2 * (1.86 + flap2),
      k.len * 0.14, k.bodyW * 0.24, k.pal.fin, k.alpha * 0.45);
  }

  // 7) 鲤须：从吻部两侧的轮廓边缘长出，摆动跟随相位——缺了它就不像锦鲤
  var nIdx = 2;
  var bw2 = k.bodyW * widthProfile(nIdx / (n - 1));
  for (var s3 = -1; s3 <= 1; s3 += 2){
    var nx = normals[nIdx].x * s3;
    var ny = normals[nIdx].y * s3;
    var bx = spine[nIdx].x + nx * bw2 * 0.86;
    var by = spine[nIdx].y + ny * bw2 * 0.86;
    var wig = Math.sin(k.phase * 1.4 + s3) * 0.2;
    var ang = bodyAngle + s3 * (0.64 + wig);
    var lenB = k.bodyW * 0.85;
    kctx.beginPath();
    kctx.moveTo(bx, by);
    kctx.quadraticCurveTo(
      bx + Math.cos(ang) * lenB * 0.58 - ny * lenB * 0.30,
      by + Math.sin(ang) * lenB * 0.58 + nx * lenB * 0.30,
      bx + Math.cos(ang) * lenB,
      by + Math.sin(ang) * lenB);
    kctx.strokeStyle = k.pal.barbel;
    kctx.lineWidth = Math.max(1, k.bodyW * 0.05);
    kctx.stroke();
  }

  // 8) 嘴线：吻端一道短弧（贴在真实轮廓宽度上，不悬在头部之外）
  var mi2 = 1;
  var mw2 = k.bodyW * widthProfile(mi2 / (n - 1)) * 0.62;
  var mpx = spine[mi2].x;
  var mpy = spine[mi2].y;
  kctx.beginPath();
  kctx.moveTo(mpx + normals[mi2].x * mw2, mpy + normals[mi2].y * mw2);
  kctx.quadraticCurveTo(
    mpx + fx * k.bodyW * 0.10,
    mpy + fy * k.bodyW * 0.10,
    mpx - normals[mi2].x * mw2,
    mpy - normals[mi2].y * mw2);
  kctx.strokeStyle = k.pal.edge;
  kctx.lineWidth = Math.max(1, k.bodyW * 0.05);
  kctx.stroke();

  // 9) 眼睛：深色瞳 + 一点高光（位置略靠头后，更接近鲤的头部比例）
  var ei = 3;
  var ew = k.bodyW * widthProfile(ei / (n - 1));
  for (var s5 = -1; s5 <= 1; s5 += 2){
    var ex2 = spine[ei].x + normals[ei].x * ew * 0.72 * s5;
    var ey2 = spine[ei].y + normals[ei].y * ew * 0.72 * s5;
    var rr = Math.max(1.6, k.bodyW * 0.085);
    kctx.beginPath();
    kctx.arc(ex2, ey2, rr, 0, Math.PI * 2);
    kctx.fillStyle = k.pal.eye;
    kctx.fill();
    kctx.beginPath();
    kctx.arc(ex2 - rr * 0.3, ey2 - rr * 0.3, rr * 0.34, 0, Math.PI * 2);
    kctx.fillStyle = 'rgba(255,255,255,0.8)';
    kctx.fill();
  }

  kctx.restore();
}

/** 初始化两条主体锦鲤与远景小鱼群（按窗口尺寸缩放，小屏不会出现"鱼比字还大"） */
function initFishes(){
  // 同时参考宽与高取较小系数，再夹在 0.48~1 之间：手机上鱼约 100px，桌面上约 210px
  var sc = Math.max(0.48, Math.min(1, Math.min(W / 1200, H / 900)));
  var lenA = 210 * sc;
  var lenB = 176 * sc;

  koiList = [
    // 一尾白底朱红（大正三色），体型最大，负责画面主角
    createKoi({
      x: W * 0.30, y: H * 0.40, len: lenA, bodyW: lenA * 0.145, speed: 56 * sc, alpha: 0.94,
      pal: {
        body0: '#fffaf3', body1: '#fdeee2', body2: '#f2dccd',
        edge: 'rgba(198,142,124,0.42)',
        tail0: 'rgba(255,246,236,0.92)', tail1: 'rgba(255,232,220,0.50)', tail2: 'rgba(255,222,210,0.04)',
        fin: 'rgba(255,238,228,0.75)',
        barbel: 'rgba(255,242,232,0.55)',
        eye: '#1b2b2e'
      },
      patches: [
        // 头部红冠 + 背部红斑 + 尾部墨斑，构成大正三色的经典三段
        { i:0.16, off: 0.02, r: 0.50, color: 'rgba(232,72,58,0.95)', seed: 1.7 },
        { i:0.40, off: 0.12, r: 0.74, color: 'rgba(224,60,50,0.92)', seed: 3.2 },
        { i:0.64, off: -0.16, r: 0.30, color: 'rgba(38,38,42,0.55)', seed: 5.1 }
      ]
    }),
    // 一尾墨底描金（墨鲤），体型略小、透明度低，制造纵深
    createKoi({
      x: W * 0.70, y: H * 0.68, len: lenB, bodyW: lenB * 0.14, speed: 46 * sc, alpha: 0.80,
      pal: {
        body0: '#1a3a42', body1: '#0d2830', body2: '#071b22',
        edge: 'rgba(140,235,210,0.30)',
        tail0: 'rgba(140,232,208,0.52)', tail1: 'rgba(53,227,179,0.20)', tail2: 'rgba(53,227,179,0.02)',
        fin: 'rgba(150,240,218,0.42)',
        barbel: 'rgba(150,240,218,0.38)',
        eye: '#04121c'
      },
      patches: [
        { i:0.18, off: 0.06, r: 0.44, color: 'rgba(242,215,155,0.80)', seed: 2.1 },
        { i:0.42, off: -0.14, r: 0.58, color: 'rgba(242,215,155,0.62)', seed: 4.4 },
        { i:0.66, off: 0.18, r: 0.26, color: 'rgba(255,248,230,0.90)', seed: 6.3 }
      ]
    })
  ];

  smallFish = [];
  for (var i = 0; i < 12; i++){
    smallFish.push({
      x: Math.random() * W,
      y: Math.random() * H,
      a: Math.random() * Math.PI * 2,
      sp: 14 + Math.random() * 22,
      s: 4 + Math.random() * 5,
      wob: Math.random() * 6.28
    });
  }
}

/** 初始化漂浮粒子 */
function initDust(){
  dust = [];
  for (var i = 0; i < 70; i++){
    dust.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1.2 + Math.random() * 3.2,
      vy: -(6 + Math.random() * 14),
      drift: (Math.random() - 0.5) * 10,
      alpha: 0.12 + Math.random() * 0.32,
      phase: Math.random() * 6.28
    });
  }
}

/** 归零时从指定点爆散光点 */
function burstSparks(cx, cy, count){
  for (var i = 0; i < count; i++){
    var ang = Math.random() * Math.PI * 2;
    var sp = 60 + Math.random() * 320;
    sparks.push({
      x: cx, y: cy,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 40,
      r: 1.5 + Math.random() * 3,
      life: 1.6 + Math.random() * 1.4
    });
  }
}

/** 绘制远景小鱼（低透明度，制造纵深） */
function drawSmallFish(f, dt){
  f.a += Math.sin((performance.now() / 1000) * 1.2 + f.wob) * 0.6 * dt;
  f.x += Math.cos(f.a) * f.sp * dt;
  f.y += Math.sin(f.a) * f.sp * dt;
  if (f.x < -40) f.x = W + 40;
  if (f.x > W + 40) f.x = -40;
  if (f.y < -40) f.y = H + 40;
  if (f.y > H + 40) f.y = -40;

  kctx.save();
  kctx.translate(f.x, f.y);
  kctx.rotate(f.a);
  kctx.globalAlpha = 0.20;
  kctx.fillStyle = '#c9f7e8';
  kctx.beginPath();
  kctx.ellipse(0, 0, f.s, f.s * 0.36, 0, 0, Math.PI * 2);
  kctx.fill();
  kctx.beginPath();
  kctx.moveTo(-f.s * 0.9, 0);
  kctx.lineTo(-f.s * 1.9, -f.s * 0.55);
  kctx.lineTo(-f.s * 1.9, f.s * 0.55);
  kctx.closePath();
  kctx.fill();
  kctx.restore();
}

/** 主渲染循环 */
function render(now){
  var dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  // —— 粒子层 ——
  dctx.clearRect(0, 0, W, H);
  for (var i = 0; i < dust.length; i++){
    var p = dust[i];
    p.y += p.vy * dt;
    p.x += (p.drift + Math.sin(now / 2000 + p.phase) * 6) * dt;
    if (p.y < -20){ p.y = H + 20; p.x = Math.random() * W; }
    if (p.x < -20) p.x = W + 20;
    if (p.x > W + 20) p.x = -20;
    dctx.globalAlpha = p.alpha;
    dctx.drawImage(glowSprite, p.x - p.r * 4, p.y - p.r * 4, p.r * 8, p.r * 8);
  }

  // 归零光点
  for (var s = sparks.length - 1; s >= 0; s--){
    var sp = sparks[s];
    sp.life -= dt;
    if (sp.life <= 0){ sparks.splice(s, 1); continue; }
    sp.vy += 220 * dt;
    sp.vx *= 0.985;
    sp.vy *= 0.985;
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    dctx.globalAlpha = Math.max(0, Math.min(1, sp.life / 1.6)) * 0.8;
    dctx.drawImage(glowSprite, sp.x - sp.r * 5, sp.y - sp.r * 5, sp.r * 10, sp.r * 10);
  }
  dctx.globalAlpha = 1;

  // —— 锦鲤层 ——
  kctx.clearRect(0, 0, W, H);
  for (var f = 0; f < smallFish.length; f++) drawSmallFish(smallFish[f], dt);
  for (var k = 0; k < koiList.length; k++){
    updateKoi(koiList[k], dt, now);
    drawKoi(koiList[k]);
  }
  kctx.globalAlpha = 1;

  if (koiRise > 0) koiRise = Math.max(0, koiRise - dt);
  requestAnimationFrame(render);
}

/** 处理画布尺寸与 DPR；尺寸变化不大时不重建鱼群，避免移动端地址栏收放导致鱼"瞬移" */
var lastW = 0, lastH = 0;
function resizeCanvas(){
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  [dustCanvas, koiCanvas].forEach(function(cv){
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
  });
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  kctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 仅当视口真正改变（>80px 宽 / >120px 高）或首次进入时才重建，日常抖动保持原样
  if (!koiList.length || Math.abs(W - lastW) > 80 || Math.abs(H - lastH) > 120){
    initFishes();
    initDust();
    lastW = W;
    lastH = H;
  }
}

/* ============================================================
   九、事件绑定与启动
   ============================================================ */

/** 渲染快捷日期胶囊 */
function renderChips(){
  el.chips.innerHTML = '';
  PRESETS.forEach(function(p){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = p.label;
    b.dataset.key = p.key;
    b.addEventListener('click', function(){
      selectPreset(p);
    });
    el.chips.appendChild(b);
  });
}

/** 点选快捷日期：算日期、填输入框、高亮、启用按钮 */
function selectPreset(p){
  var dateStr;
  if (p.date){
    dateStr = p.date;
  } else {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + p.offset);
    dateStr = toISODate(d);
  }
  activePreset = p.key;
  el.dateInput.value = dateStr;

  var chips = el.chips.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++){
    chips[i].classList.toggle('active', chips[i].dataset.key === p.key);
  }
  syncStartButton();
}

/** 自定义日期变化时清除胶囊高亮 */
function onDateChange(){
  activePreset = null;
  var chips = el.chips.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
  syncStartButton();
}

/** 没有日期时禁用「开始倒数」 */
function syncStartButton(){
  el.btnStart.disabled = !el.dateInput.value;
}

/** 开始倒数：写入状态并切到 S1 */
function startCountdown(){
  var dateStr = el.dateInput.value;
  if (!dateStr) return;
  var label = activePreset
    ? (PRESETS.filter(function(p){ return p.key === activePreset; })[0] || {}).label
    : formatShort(dateStr);
  applyTarget(dateStr, label);
}

/** 轻提示 */
function showToast(text){
  el.toast.textContent = text;
  el.toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(function(){
    el.toast.classList.remove('show');
  }, 1900);
}

/** 导出按钮：执行导出并给反馈 */
function handleExport(){
  exportSign();
  el.btnExport.disabled = true;
  el.btnExport.textContent = '已存下';
  showToast('锦鲤图已保存');
  setTimeout(function(){
    el.btnExport.disabled = false;
    el.btnExport.textContent = '存为锦鲤图';
  }, 1800);
}

/** 初始化：日期限制、读取本地目标、启动两条渲染循环 */
function init(){
  var today = toISODate(new Date());
  el.dateInput.min = today;
  el.dateInput.value = '';
  renderChips();

  el.btnStart.addEventListener('click', startCountdown);
  el.dateInput.addEventListener('change', onDateChange);
  el.btnReset.addEventListener('click', showSetup);

  el.btnDraw.addEventListener('click', openDraw);
  el.btnClose.addEventListener('click', closeDraw);
  el.btnExport.addEventListener('click', handleExport);
  el.overlay.addEventListener('click', function(e){
    if (e.target === el.overlay) closeDraw();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !el.overlay.classList.contains('hidden')) closeDraw();
  });

  el.btnCelebrateExport.addEventListener('click', function(){
    exportSign();
    showToast('这一刻已存下');
  });
  el.btnAgain.addEventListener('click', showSetup);

  window.addEventListener('pointermove', function(e){
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  });
  window.addEventListener('pointerleave', function(){
    pointer.active = false;
  });
  window.addEventListener('resize', resizeCanvas);

  // 背景引擎启动
  glowSprite = makeGlowSprite();
  resizeCanvas();
  requestAnimationFrame(render);
  requestAnimationFrame(tickLoop);

  // 恢复上次设定的目标日
  var saved = loadTarget();
  if (saved){
    state.target = saved;
    el.dateInput.value = saved.date;
    showCountdown();
  } else {
    showSetup();
  }
}

init();
</script>
